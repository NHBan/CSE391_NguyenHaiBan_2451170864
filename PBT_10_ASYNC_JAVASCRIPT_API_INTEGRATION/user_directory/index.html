<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User CRUD System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Quản Lý Người Dùng </h1>
        </header>

        <main class="main-layout">
            <section class="form-section">
                <h2 id="formTitle">Thêm Người Dùng Mới</h2>
                <form id="userForm">
                    <input type="hidden" id="userId">
                    <div class="form-group">
                        <label for="name">Họ và tên</label>
                        <input type="text" id="name" required placeholder="Nguyễn Văn A">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required placeholder="name@example.com">
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="saveBtn" class="btn btn-success">Lưu lại</button>
                        <button type="button" id="cancelBtn" class="btn btn-secondary hidden">Hủy bỏ</button>
                    </div>
                </form>
            </section>

            <section class="list-section">
                <div class="list-header">
                    <h2>Danh Sách Thành Viên</h2>
                    <input type="text" id="searchInput" placeholder="🔍 Tìm theo tên hoặc email...">
                </div>

                <div id="userGrid" class="user-grid">
                    </div>
            </section>
        </main>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
