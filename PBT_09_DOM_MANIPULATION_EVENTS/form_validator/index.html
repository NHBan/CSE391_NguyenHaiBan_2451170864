<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validate Form Real-time</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="form-container">
        <h2>Đăng Ký Tài Khoản</h2>
        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="name">Họ và tên <span class="badge"></span></label>
                <input type="text" id="name" placeholder="Nhập từ 2 - 50 ký tự">
                <div class="error-message">Tên phải từ 2 đến 50 ký tự.</div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@gmail.com">
                <div class="error-message">Email không đúng định dạng (vd: abc@domain.com).</div>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu">
                <div class="strength-meter">
                    <div class="strength-bar"></div>
                </div>
                <div class="strength-text">Mật khẩu quá ngắn</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu">
                <div class="error-message">Mật khẩu xác nhận không trùng khớp.</div>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại</label>
                <input type="text" id="phone" placeholder="0901-345-678" maxlength="12">
                <div class="error-message">Số điện thoại phải đủ 10 chữ số.</div>
            </div>

            <button type="submit" id="submitBtn" disabled>Đăng Ký</button>
        </form>
    </div>

    <div id="successModal" class="modal-overlay">
        <div class="modal-content">
            <h3>🎉 Đăng ký thành công!</h3>
            <div id="modalData"></div>
            <button id="closeModalBtn">Đóng</button>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
