<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="todo-app">
        <header>
            <h1>Todo List</h1>
            <form id="addForm">
                <input type="text" id="todoInput" placeholder="Thêm công việc mới..." autocomplete="off">
            </form>
        </header>

        <main>
            <ul id="todoList"></ul>
        </main>

        <footer id="todoFooter" class="hidden">
            <span id="todoCount"><strong>0</strong> items left</span>
            <ul class="filters" id="filters">
                <li><a href="#" class="active" data-filter="all">All</a></li>
                <li><a href="#" data-filter="active">Active</a></li>
                <li><a href="#" data-filter="completed">Completed</a></li>
            </ul>
            <button id="clearCompleted">Clear completed</button>
        </footer>
    </div>
    <script src="./app.js"></script>
</body>
</html>
